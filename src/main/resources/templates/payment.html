<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>결제하기 | BookMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/BookMarket/css/styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- TossPay SDK (Demo - 포트폴리오용) -->
    <script src="https://js.tosspayments.com/v1/payment-widget"></script>
</head>

<body>

    <div class="navbar">
        <div class="container navbar-content">
            <a href="/BookMarket/home" class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                    class="bi bi-book-half" viewBox="0 0 16 16">
                    <path
                        d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783" />
                </svg>
                BookMarket
            </a>
        </div>
    </div>

    <div class="container main-content">
        <div class="p-5 mb-4 bg-body-tertiary rounded-3 text-center border">
            <div class="container-fluid py-2">
                <h1 class="display-6 fw-bold">결제하기</h1>
                <p class="fs-5 text-muted">안전한 결제를 진행합니다.</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-7">
                <h3 class="mb-4">주문 상품</h3>
                <div class="mb-3" th:each="cart : ${cartlist}">
                    <div class="d-flex align-items-center border-bottom pb-3">
                        <img th:src="'/BookMarket/images/' + ${cart.book.filename}" th:alt="${cart.book.name}"
                            style="width: 80px; height: 100px; object-fit: cover; border-radius: 0.5rem;">
                        <div class="ms-3 flex-grow-1">
                            <h6 th:text="${cart.book.name}">도서명</h6>
                            <p class="text-muted mb-0">
                                <span
                                    th:text="${#numbers.formatInteger(cart.book.unitPrice, 0, 'COMMA')} + '원'">가격</span>
                                x
                                <span th:text="${cart.quantity}">수량</span>개
                            </p>
                        </div>
                        <div class="text-end fw-bold"
                            th:text="${#numbers.formatInteger(cart.book.unitPrice * cart.quantity, 0, 'COMMA')} + '원'">
                            소계
                        </div>
                    </div>
                </div>

                <div class="border-top pt-3 mt-4">
                    <div class="d-flex justify-content-between fs-4 fw-bold">
                        <span>총 결제금액</span>
                        <span class="text-primary"
                            th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + '원'">0원</span>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-4">결제 방법</h4>

                        <!-- TossPay 결제 위젯 (데모) -->
                        <div id="payment-widget" style="min-height: 300px;"></div>

                        <div class="alert alert-info mt-3">
                            <small>
                                <strong>포트폴리오 데모용</strong><br>
                                실제 결제는 진행되지 않습니다.
                            </small>
                        </div>

                        <button id="payment-button" class="btn btn-primary btn-lg w-100 mt-3">
                            결제하기
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <span>&copy; 2024 BookMarket. All rights reserved.</span>
        </div>
    </footer>

    <script th:inline="javascript">
        // TossPay 결제 위젯 초기화 (데모용)
        const totalAmount = /*[[${totalAmount}]]*/ 0;

        // 데모용 클라이언트 키 (실제 프로젝트에서는 환경변수로 관리)
        const clientKey = 'test_ck_demo1234567890';
        const customerKey = 'customer_' + Date.now();

        // 결제 위젯 초기화 (실제로는 TossPay SDK로 위젯 렌더링)
        document.getElementById('payment-widget').innerHTML = `
        <div class="p-4 border rounded" style="background: #f8f9fa;">
            <h5 class="mb-3">💳 토스페이먼츠</h5>
            <p class="text-muted mb-2">결제 금액: <strong>${totalAmount.toLocaleString()}원</strong></p>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="paymentMethod" id="card" checked>
                <label class="form-check-label" for="card">신용/체크카드</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="paymentMethod" id="transfer">
                <label class="form-check-label" for="transfer">계좌이체</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="paymentMethod" id="toss">
                <label class="form-check-label" for="toss">토스페이</label>
            </div>
        </div>
    `;

        // 결제 버튼 클릭 시 (데모)
        document.getElementById('payment-button').addEventListener('click', function () {
            alert('🎉 포트폴리오 데모입니다.\n실제 결제는 진행되지 않습니다.\n\nTossPay 결제창 연동 완료!');
            // 실제 구현시: TossPay 결제창 호출
            // window.location.href = '/payment/success';
        });
    </script>

</body>

</html>
