<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>도서 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/BookMarket/css/styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="navbar">
        <div class="container navbar-content">
            <a href="/BookMarket/home" class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                    class="bi bi-book-half" viewBox="0 0 16 16">
                    <path
                        d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783" />
                </svg>
                BookMarket
            </a>
            <a href="/BookMarket/books" class="btn btn-secondary">목록으로 돌아가기</a>
        </div>
    </div>

    <div class="container main-content">
        <div class="p-5 mb-4 bg-body-tertiary rounded-3 border">
            <div class="container-fluid py-2">
                <h1 class="display-5 fw-bold" th:text="${book.name}">책 제목</h1>
                <p class="fs-4 text-muted" th:text="'저자: ' + ${book.author}">저자</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-5">
                <!-- Book Cover Image -->
                <img th:src="'/BookMarket/images/' + ${book.filename}" th:alt="${book.name}"
                    style="width: 100%; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);">
            </div>
            <div class="col-md-7">
                <div style="padding: 1rem;">
                    <span class="badge bg-primary mb-3" th:text="${book.category}">분류</span>
                    <span class="badge bg-secondary mb-3" th:if="${book.condition} != null"
                        th:text="${book.condition}">신규</span>

                    <h3 class="mb-3">책 소개</h3>
                    <p class="fs-5 text-muted mb-4" th:text="${book.description}">
                        설명 텍스트...
                    </p>

                    <div class="d-grid gap-2 d-md-block mb-4">
                        <div class="fs-3 fw-bold text-primary mb-3"
                            th:text="${#numbers.formatInteger(book.unitPrice, 0, 'COMMA')} + '원'">가격</div>
                        <form th:action="@{/cart/add/{bookId}(bookId=${book.bookId})}" method="post"
                            style="display:inline;">
                            <button class="btn btn-primary btn-lg">장바구니 담기</button>
                        </form>
                        <a href="/BookMarket/cart" class="btn btn-secondary btn-lg">장바구니 보기</a>
                    </div>

                    <hr class="my-4">

                    <div class="text-muted">
                        <p class="mb-1"><strong>출판사:</strong> <span th:text="${book.publisher}">출판사</span></p>
                        <p class="mb-1"><strong>출간일:</strong> <span th:text="${book.releaseDate}">날짜</span></p>
                        <p class="mb-1"><strong>ISBN:</strong> <span th:text="${book.bookId}">ISBN</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <span>&copy; 2024 BookMarket. All rights reserved.</span>
        </div>
    </footer>

</body>

</html>
