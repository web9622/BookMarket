# =========================
# Server Configuration
# =========================
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/BookMarket

# =========================
# PostgreSQL Database (Railway Auto-Injection)
# =========================
# Railway automatically provides DATABASE_URL in the format:
# postgresql://user:password@host:port/database
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# HikariCP Connection Pool Settings
# =========================
# Prevent indefinite hangs on connection failure
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# =========================
# JPA/Hibernate Settings
# =========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# Logging (Production)
# =========================
logging.level.root=INFO
logging.level.com.springboot=INFO