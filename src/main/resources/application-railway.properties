# Railway 필수 설정 - 최우선 적용
server.port=${PORT:8080}
server.address=0.0.0.0

# 만약 위가 안 먹히면 환경변수 직접 참조 (Spring Boot 3.x에서 잘 됨)
# server.port=${env.PORT:8080}   ← 이 줄은 주석 풀어서 테스트 가능

# 나머지 DB 등 설정...
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver